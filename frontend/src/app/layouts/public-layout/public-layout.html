<div class="d-flex flex-column min-vh-100" style="background-color: #FCFAF5;">
<nav class="navbar navbar-expand-lg navbar-dark shadow-sm" style="background-color: #16202B;">
  <div class="container">
    <a class="navbar-brand d-flex align-items-center gap-3" routerLink="/portal/tiendas" style="text-decoration: none;">
      <div class="rounded-3 d-flex justify-content-center align-items-center" style="background-color: #1D3557; width: 44px; height: 44px;">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" style="width: 28px; height: 28px;">
          <g stroke="#ffffff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M 10 12 C 10 5.5 22 5.5 22 12" />
            <line x1="4" y1="12" x2="28" y2="12" />
            <path d="M 5 12 L 8 27 C 8.2 27.8 8.8 28 9.5 28 L 11 28 L 11 16 L 16 20 L 21 16 L 21 28 L 22.5 28 C 23.2 28 23.8 27.8 24 27 L 27 12" />
          </g>
          <path d="M 16 22 C 14.5 22 13.5 23 13.5 24.5 C 13.5 26.5 16 29.5 16 29.5 C 16 29.5 18.5 26.5 18.5 24.5 C 18.5 23 17.5 22 16 22 Z" fill="#ffffff"/>
          <circle cx="16" cy="24.2" r="1" fill="#1D3557"/>
        </svg>
      </div>
      <div class="d-flex flex-column lh-1 justify-content-center text-white">
        <span class="font-display fw-bold mb-1" style="font-size: 1.25rem; letter-spacing: -0.5px;">MercaLink <span style="font-weight: 900;">&bull;</span> Panel</span>
        <span class="text-white-50" style="font-size: 0.85rem; font-weight: 500;">Selecciona tu tienda</span>
      </div>
    </a>
    
    <button class="navbar-toggler border-0 focus-ring-0" type="button" data-bs-toggle="collapse" data-bs-toggle="collapse" data-bs-target="#navbarPublic">
      <span class="navbar-toggler-icon"></span>
    </button>
    
    <div class="collapse navbar-collapse" id="navbarPublic">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0">
        <!-- Eliminado el link redundante de Directorio -->
      </ul>
      
      <div class="d-flex align-items-center gap-3">
        <ng-container *ngIf="auth.isAuthenticated(); else noAuth">
          <div class="d-flex align-items-center text-end me-3 text-white">
            <div class="d-flex flex-column lh-1 d-none d-md-flex">
              <span class="small fw-bold mb-1">{{ auth.currentUser()?.nombre }} {{ auth.currentUser()?.apellido }}</span>
              <span class="text-white-50" style="font-size: 0.75rem;">{{ auth.currentUser()?.email }}</span>
            </div>
          </div>
          <button class="btn btn-sm btn-outline-light d-flex align-items-center gap-2 rounded-2 px-3 py-2 border-opacity-25" (click)="logout()">
            <i class="bi bi-box-arrow-right"></i> <span class="d-none d-md-inline">Salir</span>
          </button>
        </ng-container>
        
        <ng-template #noAuth>
          <a routerLink="/login" class="btn btn-outline-secondary rounded-pill px-4">Iniciar Sesión</a>
          <a routerLink="/register" class="btn btn-primary rounded-pill px-4">Crear Cuenta</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>

<main class="flex-grow-1 pt-3">
  <router-outlet></router-outlet>
</main>
</div>
